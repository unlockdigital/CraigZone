name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 tools/check.py
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Configure the test browser sandbox
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test_sandbox="$(dirname "$CHROME_BINARY")/chrome_sandbox"
          if [ -f "$test_sandbox" ]; then
            sudo chown root:root "$test_sandbox"
            sudo chmod 4755 "$test_sandbox"
          else
            test_sandbox=/opt/google/chrome/chrome-sandbox
          fi
          test -x "$test_sandbox"
          test "$(stat -c '%u' "$test_sandbox")" = 0
          test "$(stat -c '%a' "$test_sandbox")" = 4755
          printf 'CHROME_DEVEL_SANDBOX=%s\n' "$test_sandbox" >> "$GITHUB_ENV"
      - run: python3 tools/browser_check.py "$CHROME_BINARY"
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
