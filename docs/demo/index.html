<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CraigZone video demo</title>
<style>body{font:18px system-ui;margin:24px;color:#edf2ff;background:#111827}main{max-width:900px;margin:auto}#player{position:relative;width:min(100%,800px);aspect-ratio:16/9}video{width:100%;height:100%;background:#000}button{position:absolute;inset:auto auto 20px 20px;font:inherit;padding:12px 24px;border:0;border-radius:8px}p{line-height:1.5}</style></head>
<body><main><h1>CraigZone demo</h1><p>Open two video tabs, select them in CraigZone, start the controls, then click Play.</p><div id="player"><video controls></video><button aria-label="Play demo video">Play</button></div><p>The video is drawn locally for this demo.</p></main>
<script>const videoNumber=new URLSearchParams(location.search).get('video')||'1';document.title='Demo video '+videoNumber;const canvas=document.createElement('canvas');canvas.width=800;canvas.height=450;const ctx=canvas.getContext('2d'),video=document.querySelector('video');let phase=0;setInterval(()=>{ctx.fillStyle='#15223a';ctx.fillRect(0,0,800,450);ctx.fillStyle='#dce7ff';ctx.font='40px system-ui';ctx.fillText('Demo video '+videoNumber,60,100);ctx.fillStyle='#59b7a5';ctx.fillRect((phase++*5)%700,200,100,100)},100);video.srcObject=canvas.captureStream(10);video.muted=true;document.querySelector('button').onclick=()=>video.play();</script></body></html>
